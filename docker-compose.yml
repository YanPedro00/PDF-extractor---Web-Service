# Docker Compose para PDF Utilities (ARM64 otimizado com Tesseract)

services:
  # Serviço Next.js (Web App)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-utilities-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Volume para banco de dados SQLite (autenticação)
      - /home/ubuntu/pdf-utilities-data:/app/data
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_PATH=/app/data/users.db
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://pdf-utilities.com.br}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-pdf-utilities-secret-key-change-in-production}
      # Variáveis de ambiente para APIs (usando subdomínio api com SSL Let's Encrypt)
      - NEXT_PUBLIC_OCR_API_URL=${NEXT_PUBLIC_OCR_API_URL:-https://api.pdf-utilities.com.br/api}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://api.pdf-utilities.com.br/api}
      - NEXT_PUBLIC_TIFF_API_URL=${NEXT_PUBLIC_TIFF_API_URL:-https://api.pdf-utilities.com.br/tiff-api}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://pdf-utilities.com.br}
    networks:
      - app-network
    depends_on:
      - ocr-api
      - tiff-api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # API OCR (Flask) - Surya OCR (especializado em documentos/tabelas)
  ocr-api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: pdf-utilities-ocr-api
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      # Volume mount para modelos - persiste entre rebuilds
      - /home/ubuntu/surya-models:/root/.cache/huggingface:rw
    environment:
      - PORT=8080
      - HF_HOME=/root/.cache/huggingface
      - OPENCV_IO_ENABLE_OPENEXR=0
      - QT_QPA_PLATFORM=offscreen
      - OPENCV_HEADLESS=1
      - OPENCV_AVOID_OPENGL=1
      - OPENCV_SKIP_OPENCL=1
      - DISPLAY=:99
      - OMP_NUM_THREADS=4
      - PYTORCH_ENABLE_MPS_FALLBACK=1
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  # API TIFF to PDF (FastAPI)
  tiff-api:
    build:
      context: ./tiff-to-pdf-api
      dockerfile: Dockerfile
    container_name: pdf-utilities-tiff-api
    restart: unless-stopped
    expose:
      - "8001"
    environment:
      - PORT=8001
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx como Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: pdf-utilities-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # Para certificados SSL (opcional)
    depends_on:
      - web
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge

